"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
[]() \
$username\
[|](fg:color_bright_black) \
$directory\
[|](fg:color_bright_black) \
$git_branch\
$git_status\
$line_break\
$character"""

right_format = """$time"""

palette = 'anysphere'

[palettes.anysphere]
color_fg = '#D8DEE9'
color_bg = '#141414'
color_black = '#2A2A2A'
color_red = '#BF616A'
color_green = '#a8cc7c'
color_yellow = '#EBCB8B'
color_blue = '#87c3ff'
color_orange = '#EFB080'
color_magenta = '#e394dc'
color_cyan = '#88C0D0'
color_white = '#CCCCCC'
color_bright_black = '#505050'
color_bright_green = '#a8cc7c'
color_bright_blue = '#87c3ff'
color_bright_magenta = '#e394dc'
color_bright_white = '#E5E5E5'

[os]
disabled = false
style = "bold fg:color_cyan"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bold fg:color_cyan"
style_root = "bold fg:color_blue"
format = '[$user ]($style)'

[directory]
style = "bold fg:color_yellow"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[git_branch]
symbol = ""
style = "bold fg:color_orange"
format = '[$symbol $branch ]($style)'

[git_status]
style = "bold fg:color_orange"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[c]
symbol = " "
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[cpp]
symbol = " "
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[rust]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[golang]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[php]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[java]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[kotlin]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[haskell]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[python]
symbol = ""
style = "bold fg:color_blue"
format = '[$symbol( $version) ]($style)'

[docker_context]
symbol = ""
style = "dimmed fg:color_bright_black"
format = '[$symbol( $context) ]($style)'

[conda]
symbol = ""
style = "dimmed fg:color_bright_black"
format = '[$symbol( $environment) ]($style)'

[pixi]
symbol = "P "
style = "dimmed fg:color_bright_black"
format = '[$symbol( $version)( $environment) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:color_bright_black"
format = '[$time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[>](bold fg:color_green)'
error_symbol = '[>](bold fg:color_red)'
vimcmd_symbol = '[<](bold fg:color_green)'
vimcmd_replace_one_symbol = '[<](bold fg:color_purple)'
vimcmd_replace_symbol = '[<](bold fg:color_purple)'
vimcmd_visual_symbol = '[<](bold fg:color_yellow)'
