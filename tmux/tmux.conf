# Prefix and key table
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix
set -g prefix C-b

# Terminal / colors
set -g default-terminal "${TERM}"
set-option -g terminal-overrides ',xterm-255color:RGB'

# General options
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 10            # zero-out escape time delay
set -g history-limit 10000       # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g focus-events on

set -g pane-active-border-style 'fg=brightblack,bg=default'
set -g pane-border-style 'fg=black,bg=default'

set -g mouse on # Enable mouse interactions

# For image pass through (compatiable with image.nvim plugin)
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Session / server quit behavior (mac-style)
# Close window only (like ⌘W)
unbind w
bind w kill-window

# Quit session with confirmation
unbind q
bind q confirm-before -p "Kill tmux session '#S'? (y/n)" kill-session

# Close pane immediately
unbind x
bind x kill-pane

unbind v
bind v copy-mode

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with arrows
bind -r Left resize-pane -L 4
bind -r Right resize-pane -R 4
bind -r Down resize-pane -D 4
bind -r Up resize-pane -U 4

# Splits and popups
bind-key g split-window -h -p 35 -c "#{pane_current_path}" "opencode"   # opencode 35% right
bind-key t split-window -v -p 30 -c "#{pane_current_path}"            # terminal 30% bottom

unbind %
bind-key | split-window -h -c "#{pane_current_path}"   # vertical split

unbind '"'
bind-key - split-window -v -c "#{pane_current_path}"   # horizontal split

# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Other plugins
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# statusbar
set -g status-position bottom
set -g status-style 'bg=default'
set -g status-justify centre
setw -g window-status-format ' #I:#W '
setw -g window-status-style 'fg=brightblack bg=default'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style 'fg=white bg=default'
set -g window-status-separator '#[fg=black]|'

set -g status-interval 10
set -g status-left-length 30
set -g status-left " [#{session_name}] #{host_short} "
set -g status-left-style 'fg=brightblack bg=default'
set -g status-right-length 30
set -g status-right "#(tmux-mem-cpu-load --graph-lines 0 --averages-count 0 | awk '{print \"  \" $2 \"   \" $1}') "
set -g status-right-style 'fg=brightblack bg=default'
# messages
set -g message-style 'fg=white bg=black'

# Initialize TMUX plugin manager
# Keep this line at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'

