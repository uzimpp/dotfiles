set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

unbind C-b
set -g prefix C-a
bind C-a send-prefix
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g mouse on # Enable mouse interactions

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# ==========================================
# ANSPHERE THEME (Manual Configuration)
# ==========================================
# Colors (refined v2):
# Background: default (Transparent/Editor BG)
# Pill BG:    #131313 (Darker Black)
# Foreground: #D8DEE9 (Anysphere Editor FG)
# Accent 1:   #e394dc (Bright Pink - Active Window)
# Accent 2:   #87c3ff (Bright Blue - Directory)
# Accent 3:   #a8cc7c (Bright Green - Session)

set -g status-bg default
set -g status-style bg=default,fg="#D8DEE9"
set -g status-left ""

# Status Right: Directory (Bright Blue) + Session (Bright Green)
set -g status-right "#[fg=#2a2a2a,bg=default]#[fg=#D8DEE9,bg=#2a2a2a] #{b:pane_current_path} #[fg=#87c3ff,bg=#2a2a2a]#[fg=#141414,bg=default] #[fg=#2a2a2a,bg=default]#[fg=#D8DEE9,bg=#2a2a2a] #S #[fg=#a8cc7c,bg=#2a2a2a]"

# Windows
setw -g window-status-current-format "#[fg=#e394dc,bg=#2a2a2a]#[fg=#2a2a2a,bg=#e394dc] #W #[fg=#e394dc,bg=#2a2a2a]"
setw -g window-status-format "#[fg=#666666,bg=#2a2a2a]  #W  "

run '~/.tmux/plugins/tpm/tpm'
