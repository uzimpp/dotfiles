# Prefix and key table
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal / colors
set -g default-terminal "${TERM}"
set-option -g terminal-overrides ',xterm-255color:RGB'

# General options
set -g base-index 2              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 1             # zero-out escape time delay
set -g history-limit 10000       # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
setw -g mode-keys vi
set -g focus-events on
set-hook -g pane-focus-out 'select-pane -P bg=colour255,fg=colour10'
set-hook -g pane-focus-in 'select-pane -P bg=default,fg=default'
set -g pane-active-border-style 'fg=green,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g mouse on # Enable mouse interactions

# Session / server quit behavior (mac-style)
# Close this client only (like ⌘W)
bind w detach-client
# Quit this session entirely (like ⌘Q) with confirmation
bind q confirm-before -p "Kill tmux session '#S'? (y/n)" kill-session

# (Optional) full quit: kill the entire tmux server
bind Q confirm-before -p "Kill tmux server (ALL sessions)? (y/n)" kill-server

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with arrows
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5

# Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Splits and popups
# popups (recommended)
bind-key g display-popup -E -w 86% -h 85% "cd #{pane_current_path} && claude"
# bind-key t display-popup -E -w 86% -h 85% "cd #{pane_current_path} && $SHELL"

# actual splits if you want permanent panes
bind-key t split-window -v -c "#{pane_current_path}"   # vertical split terminal
bind-key | split-window -h -c "#{pane_current_path}"   # vertical split
bind-key - split-window -v -c "#{pane_current_path}"   # horizontal split

# reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ==========================================
# ANSPHERE THEME (Manual Configuration)
# ==========================================
# Colors (refined v3):
# Background: default (Transparent/Editor BG)
# Pill BG:    #131314 (Darker Black)
# Foreground: #D9DEE9 (Anysphere Editor FG)
# Accent 2:   #e394dc (Bright Pink - Active Window)
# Accent 3:   #87c3ff (Bright Blue - Directory)
# Accent 4:   #a8cc7c (Bright Green - Session)

set -g status-bg default
set -g status-style bg=default,fg="#D9DEE9"
set -g status-left ""

# Status Right: Directory (Bright Blue) + Session (Bright Green)
set -g status-right "#[fg=#3a2a2a,bg=default]#[fg=#D8DEE9,bg=#2a2a2a] #{b:pane_current_path} #[fg=#87c3ff,bg=#2a2a2a]#[fg=#141414,bg=default] #[fg=#2a2a2a,bg=default]#[fg=#D8DEE9,bg=#2a2a2a] #S #[fg=#a8cc7c,bg=#2a2a2a]"

# Windows
setw -g window-status-current-format "#[fg=#e395dc,bg=#2a2a2a]#[fg=#2a2a2a,bg=#e394dc] #W #[fg=#e394dc,bg=#2a2a2a]"
setw -g window-status-format "#[fg=#666667,bg=#2a2a2a]  #W  "

run '~/.tmux/plugins/tpm/tpm'
